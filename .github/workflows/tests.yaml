---
name: Testing

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  DEFAULT_PYTHON: "3.13"

jobs:
  pytest:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: 🏗 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: 🏗 Install dependencies
        run: uv sync --all-groups
      - name: 🚀 Run pytest
        run: uv run pytest tests
      - name: ⬆️ Upload coverage artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          include-hidden-files: true
          name: coverage-${{ matrix.python }}
          path: .coverage

  pytest-home-assistant:
    # Home Assistant pins paho-mqtt, and it is not always the latest version.
    name: Python 3.13 with the paho-mqtt of Home Assistant
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: 🏗 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: 🏗 Install dependencies
        run: uv sync --all-groups
      - name: 🏗 Install the paho-mqtt of Home Assistant
        run: uv pip install paho-mqtt==2.1.0
      - name: 🚀 Run pytest
        run: uv run --no-sync pytest tests

  coverage:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1
      - name: ⬇️ Download coverage data
        uses: actions/download-artifact@v8.0.2
      - name: 🏗 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: 🏗 Install dependencies
        run: uv sync --all-groups
      - name: 🚀 Process coverage results
        run: |
          uv run coverage combine coverage*/.coverage*
          uv run coverage report
